{% extends "base.html" %}
{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="text-center fade-in py-5">
    <i class="bi bi-bug" style="font-size: 5rem; color: #eb3349;"></i>
    <h1 class="display-4 text-white mt-3">500</h1>
    <h3 class="text-muted">Internal Server Error</h3>
    <p class="text-muted">Something went wrong on our end. Please try again later.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary mt-3">
        <i class="bi bi-house"></i> Go Home
    </a>
</div>
{% endblock %}
