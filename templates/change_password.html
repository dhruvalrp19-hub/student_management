{% extends "base.html" %}
{% block title %}Change Password - Student Management System{% endblock %}

{% block content %}
<div class="row justify-content-center fade-in">
    <div class="col-md-5">
        <div class="card p-5">
            <div class="text-center mb-4">
                <i class="bi bi-key-fill" style="font-size: 3rem; color: #f7971e;"></i>
                <h2 class="text-white mt-2">Change Password</h2>
                <p class="text-muted">Update your account password securely</p>
            </div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="current_password" class="form-label"><i class="bi bi-lock"></i> Current Password</label>
                    <input type="password" class="form-control" id="current_password" name="current_password" required>
                </div>

                <div class="mb-3">
                    <label for="new_password" class="form-label"><i class="bi bi-lock-fill"></i> New Password</label>
                    <input type="password" class="form-control" id="new_password" name="new_password" required minlength="8" oninput="checkStrength()">
                    <div id="password-strength" class="mt-1"></div>
                </div>

                <div class="mb-3">
                    <label for="confirm_password" class="form-label"><i class="bi bi-lock-fill"></i> Confirm New Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                </div>

                <button type="submit" class="btn btn-warning w-100 py-2 mt-3">
                    <i class="bi bi-check-circle"></i> Update Password
                </button>
            </form>

            <div class="text-center mt-3">
                <small class="security-badge">
                    <i class="bi bi-shield-check"></i> Hashed with PBKDF2-SHA256 (260,000 iterations)
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function checkStrength() {
    const password = document.getElementById('new_password').value;
    const display = document.getElementById('password-strength');
    let score = 0;
    if (password.length >= 8) score++;
    if (/[A-Z]/.test(password)) score++;
    if (/[a-z]/.test(password)) score++;
    if (/\d/.test(password)) score++;
    if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) score++;
    const levels = ['', 'Very Weak', 'Weak', 'Medium', 'Strong', 'Very Strong'];
    const colors = ['', '#eb3349', '#f45c43', '#f7971e', '#38ef7d', '#11998e'];
    const widths = ['0%', '20%', '40%', '60%', '80%', '100%'];
    display.innerHTML = `
        <div style="background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; overflow: hidden;">
            <div style="width: ${widths[score]}; height: 100%; background: ${colors[score]}; transition: all 0.3s; border-radius: 10px;"></div>
        </div>
        <small style="color: ${colors[score]};">${levels[score]}</small>`;
}
</script>
{% endblock %}
