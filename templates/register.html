{% extends "base.html" %}
{% block title %}Register - Student Management System{% endblock %}

{% block content %}
<div class="row justify-content-center fade-in">
    <div class="col-md-6">
        <div class="card p-5">
            <div class="text-center mb-4">
                <i class="bi bi-person-plus-fill" style="font-size: 3rem; color: #38ef7d;"></i>
                <h2 class="text-white mt-2">Create Account</h2>
                <p class="text-muted">Register a new secure account</p>
            </div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="username" class="form-label"><i class="bi bi-person"></i> Username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Min 3 characters" required minlength="3">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label"><i class="bi bi-envelope"></i> Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="your@email.com" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label"><i class="bi bi-lock"></i> Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Min 8 characters" required minlength="6" oninput="checkStrength()">
                        <div id="password-strength" class="mt-1"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="confirm_password" class="form-label"><i class="bi bi-lock-fill"></i> Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Repeat password" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label"><i class="bi bi-person-badge"></i> Role</label>
                    <select class="form-select" id="role" name="role">
                        <option value="teacher">Teacher</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 mt-3">
                    <i class="bi bi-person-check"></i> Register
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted">Already have an account? <a href="{{ url_for('login') }}" style="color: #667eea;">Login here</a></p>
            </div>

            <div class="text-center mt-3">
                <small class="security-badge">
                    <i class="bi bi-shield-check"></i> Password hashed with PBKDF2-SHA256
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function checkStrength() {
    const password = document.getElementById('password').value;
    const display = document.getElementById('password-strength');
    let score = 0;
    if (password.length >= 8) score++;
    if (/[A-Z]/.test(password)) score++;
    if (/[a-z]/.test(password)) score++;
    if (/\d/.test(password)) score++;
    if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) score++;

    const levels = ['', 'Very Weak', 'Weak', 'Medium', 'Strong', 'Very Strong'];
    const colors = ['', '#eb3349', '#f45c43', '#f7971e', '#38ef7d', '#11998e'];
    const widths = ['0%', '20%', '40%', '60%', '80%', '100%'];

    display.innerHTML = `
        <div style="background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; overflow: hidden;">
            <div style="width: ${widths[score]}; height: 100%; background: ${colors[score]}; transition: all 0.3s; border-radius: 10px;"></div>
        </div>
        <small style="color: ${colors[score]};">${levels[score]}</small>
    `;
}
</script>
{% endblock %}
